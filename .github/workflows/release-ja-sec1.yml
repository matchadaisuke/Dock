name: Release JA Security Build

# This release is intentionally triggered by a marker commit after the reviewed
# changes have passed CI and landed on main.
on:
  push:
    branches: [main]
    paths:
      - '.release/v1.2.0-ja-sec1'

permissions:
  contents: write

concurrency:
  group: release-v1.2.0-ja-sec1
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, verify & release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TAG: v1.2.0-ja-sec1

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install required SDK components
        run: |
          set -euo pipefail
          (yes || true) | sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" \
            "platform-tools" >/dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare API configuration and signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "${SPOTIFY_CLIENT_ID:-}" ]; then echo "spotify.clientId=$SPOTIFY_CLIENT_ID" >> local.properties; fi
          if [ -n "${UNSPLASH_ACCESS_KEY:-}" ]; then echo "unsplash.accessKey=$UNSPLASH_ACCESS_KEY" >> local.properties; fi
          mkdir -p .signing

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${ANDROID_KEY_ALIAS:-}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .signing/release.keystore
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
            echo "mode=persistent" >> "$GITHUB_OUTPUT"
          else
            # Forks do not inherit Actions secrets. For this first test release,
            # create a unique key rather than silently using Android's public
            # debug key. This release is marked prerelease because the key is not
            # retained and therefore cannot provide update continuity.
            STORE_PASS=$(openssl rand -hex 24)
            KEY_PASS="$STORE_PASS"
            KEY_ALIAS="dock-ja-sec1"
            keytool -genkeypair -noprompt \
              -keystore .signing/release.keystore \
              -storetype JKS \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=Dock JA Security Test,O=matchadaisuke"
            echo "mode=ephemeral" >> "$GITHUB_OUTPUT"
            echo "::warning::No persistent Android signing secrets were configured. Using a unique one-time signing key and marking this release as prerelease."
          fi

          {
            echo "signing.keystoreFile=$(pwd)/.signing/release.keystore"
            echo "signing.keystorePassword=$STORE_PASS"
            echo "signing.keyAlias=$KEY_ALIAS"
            echo "signing.keyPassword=$KEY_PASS"
          } >> local.properties

      - name: Run unit tests
        run: ./gradlew :app:testFiretvDebugUnitTest --no-daemon --stacktrace

      - name: Run lint
        run: ./gradlew :app:lintFiretvDebug --no-daemon --stacktrace

      - name: Build release APKs
        run: ./gradlew :app:assembleFiretvRelease :app:assembleGoogletvRelease --no-daemon --stacktrace

      - name: Verify signatures and stage artifacts
        id: verify
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          apks=(app/build/outputs/apk/*/release/*.apk)
          if [ ${#apks[@]} -ne 2 ]; then
            echo "::error::Expected two release APKs, found ${#apks[@]}"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            cp "$apk" "artifacts/$(basename "$apk" .apk)-${TAG}.apk"
          done
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)
          CERT_SHA256=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "${apks[0]}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test -n "$CERT_SHA256"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          cat artifacts/SHA256SUMS.txt

      - name: Write release notes
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          CERT_SHA256: ${{ steps.verify.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## Dock 1.2.0 JA Security Build 1

          Fork release based on Dock 1.2.0, preserving the existing feature set while adding Japanese localization and targeted security hardening.

          ### Changes
          - Japanese UI localization across dashboard and settings.
          - Secret calendar iCal URLs are encrypted at rest with Android Keystore-backed EncryptedSharedPreferences, including migration from legacy plaintext preferences.
          - Calendar feeds require HTTPS; insecure redirects and embedded URL credentials are rejected, and feed downloads are size-limited.
          - LAN setup no longer exposes saved URLs before PIN verification; LAN-only client checks, no-store headers and browser security headers were added.
          - Android backup is disabled to reduce accidental export of local app data.
          - Release builds no longer silently fall back to Android's known debug signing key.
          - APK signatures are verified during CI and SHA-256 checksums are attached.

          ### Compatibility
          - Fire TV: minSdk 25
          - Google / Android TV: minSdk 29

          The optional Home Lab, Ad Block, wallpaper, Spotify, AirPlay/Cast/Miracast, VPN and soundbar functionality remains in the app. Calendar URLs specifically require HTTPS; private-LAN HTTP remains available for the existing local-dashboard features.
          EOF

          {
            echo
            echo "### Signing"
            echo "- Signing mode: **$SIGNING_MODE**"
            echo "- Signing certificate SHA-256: \`$CERT_SHA256\`"
            if [ "$SIGNING_MODE" = "ephemeral" ]; then
              echo "- **Test-release warning:** this APK was signed with a unique one-time release key because no persistent signing secrets were configured in the fork. A future APK signed with another key cannot update this installation in place; uninstall/reinstall would be required. Configure persistent Android signing secrets before producing a stable update line."
            else
              echo "- Persistent release-key secrets were configured for update continuity."
            fi
            echo
            echo "### APK SHA-256"
            echo '```text'
            cat artifacts/SHA256SUMS.txt
            echo '```'
          } >> release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          prerelease=()
          if [ "$SIGNING_MODE" = "ephemeral" ]; then prerelease=(--prerelease); fi
          gh release create "$TAG" \
            artifacts/*.apk artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Dock 1.2.0 JA Security Build 1" \
            --notes-file release-notes.md \
            "${prerelease[@]}"

      - name: Summary
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          CERT_SHA256: ${{ steps.verify.outputs.cert_sha256 }}
        run: |
          {
            echo "## Released $TAG"
            echo "- Signing mode: $SIGNING_MODE"
            echo "- Certificate SHA-256: \`$CERT_SHA256\`"
            echo "- APKs: Fire TV + Google/Android TV"
            echo
            cat artifacts/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"
