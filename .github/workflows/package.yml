name: Package APKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.2.0-ja-sec1). Defaults to the latest release."
        required: false
        default: ""
      flavor:
        description: "Which flavor(s) to build"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - firetv
          - googletv

concurrency:
  group: package-${{ github.event.inputs.tag || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    name: Build, verify & upload APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$INPUT_TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          else
            TAG="$INPUT_TAG"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout source at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install required SDK components
        run: |
          set -euo pipefail
          (yes || true) | sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" \
            "platform-tools" >/dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "${SPOTIFY_CLIENT_ID:-}" ]; then echo "spotify.clientId=$SPOTIFY_CLIENT_ID" >> local.properties; fi
          if [ -n "${UNSPLASH_ACCESS_KEY:-}" ]; then echo "unsplash.accessKey=$UNSPLASH_ACCESS_KEY" >> local.properties; fi

          for required in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "::error::$required is not configured. Refusing to create a release signed with a debug key."
              exit 1
            fi
          done

          mkdir -p .signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .signing/release.keystore
          {
            echo "signing.keystoreFile=$(pwd)/.signing/release.keystore"
            echo "signing.keystorePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "signing.keyAlias=$ANDROID_KEY_ALIAS"
            echo "signing.keyPassword=$ANDROID_KEY_PASSWORD"
          } >> local.properties

      - name: Build firetv release APK
        if: inputs.flavor == 'firetv' || inputs.flavor == 'both'
        run: ./gradlew :app:assembleFiretvRelease --no-daemon --stacktrace

      - name: Build googletv release APK
        if: inputs.flavor == 'googletv' || inputs.flavor == 'both'
        run: ./gradlew :app:assembleGoogletvRelease --no-daemon --stacktrace

      - name: Stage and verify APKs
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          apks=(app/build/outputs/apk/*/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No release APKs were produced"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            name=$(basename "$apk" .apk)
            cp "$apk" "artifacts/${name}-${TAG}.apk"
          done
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt

      - name: Upload APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" artifacts/* --clobber

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "## Package run for $TAG"
            echo
            echo "- **Signing:** configured release keystore"
            echo "- **Verification:** apksigner verified"
            echo "- **SHA-256:** attached as SHA256SUMS.txt"
            echo
            cat artifacts/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"
