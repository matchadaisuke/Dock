name: One-shot warning fixes

on:
  push:
    branches: [chatgpt/ja-security-hardening]
    paths:
      - '.github/workflows/one-shot-warning-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/ja-security-hardening

      - name: Apply exact warning fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'app/src/main/java/com/ambient/tvclock/MusicScreenBinder.kt': [
                  ('AlbumArtBlur.blur(art!!)', 'AlbumArtBlur.blur(art)', 1),
              ],
              'app/src/main/java/com/ambient/tvclock/SpotifyApiClient.kt': [
                  ('finalisePlaylists(context, token, collected, myUserId)', 'finalisePlaylists(token, collected, myUserId)', 2),
                  ('    private fun finalisePlaylists(\n        context: Context,\n        token: String,', '    private fun finalisePlaylists(\n        token: String,', 1),
              ],
              'app/src/main/java/com/ambient/tvclock/receiver/airplay/AirPlayControlHandler.kt': [
                  ('return handleInfoQualifier(request, dict)', 'return handleInfoQualifier(dict)', 1),
                  ('private fun handleInfoQualifier(request: RtspRequest, dict: NSDictionary): RtspResponse', 'private fun handleInfoQualifier(dict: NSDictionary): RtspResponse', 1),
                  ('val keys = (0 until root.count()).mapNotNull { root.allKeys()[it] as? String }', 'val keys = (0 until root.count()).map { root.allKeys()[it] }', 1),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new, expected in edits:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{filename}: expected {expected} occurrence(s), found {count}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Commit fixes and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-warning-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: clear remaining Kotlin compiler warnings"
          git push origin HEAD:chatgpt/ja-security-hardening
